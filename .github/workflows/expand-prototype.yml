name: Expand DUORIA prototype

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, 'chore: expand prototype') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand project source
        run: tar -xzf .duoria/duoria-code.tgz

      - name: Commit expanded source
        run: |
          rm -rf .duoria
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: expand prototype"
          git push
